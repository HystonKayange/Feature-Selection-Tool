[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-selector-tool"
version = "0.5.0"
description = "Leakage-safe multi-method feature selection with research comparisons and nested CV"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "Hyston Kayange" },
]
keywords = [
    "feature-selection",
    "machine-learning",
    "scikit-learn",
    "tabular",
    "data-science",
    "stability-selection",
    "benchmark",
    "nested-cv",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]
ui = [
    "streamlit>=1.28.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]
all = [
    "feature-selector-tool[dev,ui,docs]",
]

[project.urls]
Homepage = "https://github.com/HystonKayange/Feature-Selection-Tool"
Repository = "https://github.com/HystonKayange/Feature-Selection-Tool"
Issues = "https://github.com/HystonKayange/Feature-Selection-Tool/issues"
Documentation = "https://github.com/HystonKayange/Feature-Selection-Tool/tree/main/docs"
Changelog = "https://github.com/HystonKayange/Feature-Selection-Tool/blob/main/CHANGELOG.md"

[project.scripts]
feature-select = "feature_selector.cli:main"

[tool.setuptools.packages.find]
include = ["feature_selector*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
feature_selector = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::UserWarning",
]
